[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapecore"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "aiohttp>=3.9",
]

[project.scripts]
scrapecore-gateway = "scrapecore.gateway.__main__:main"

[project.optional-dependencies]
curl = [
    "curl_cffi>=0.7",
]
